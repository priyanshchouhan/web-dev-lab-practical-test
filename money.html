<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    
    <link rel="stylesheet" href="money.css">

</head>
<body>

    <h1>Expense Tracker</h1>

    <!-- Balance Display + Edit Option -->
    <section id="balance-section">
        <h2>
            Available Cash: ₹<span id="balance-amount">0</span>
            <button type="button" id="edit-cash-btn">Edit</button>
        </h2>

        <!-- Hidden Edit Input (Edit dabane par dikhega) -->
        <div id="edit-cash-box" hidden>
            <input type="number" id="edit-cash-input" placeholder="Enter new balance">
            <button type="button" id="save-cash-btn">Save</button>
            <button type="button" id="cancel-edit-btn">Cancel</button>
        </div>
    </section>

    <hr>

    <!-- Add Cash Form -->
    <section id="add-cash-section">
        <h2>Add Cash</h2>
        <form id="cash-form">
            <div>
                <label for="cash-amount">Cash Amount:</label>
                <input type="number" id="cash-amount" name="cash-amount" placeholder="Enter cash amount" required>
            </div>
            <br>
            <button type="submit" id="add-cash-btn">Add Cash</button>
        </form>
    </section>

    <hr>

    <!-- Add Expense Form -->
    <section id="add-expense-section">
        <h2>Add Expense</h2>
        <form id="expense-form">
            <div>
                <label for="expense-name">Expense Name:</label>
                <input type="text" id="expense-name" name="expense-name" placeholder="Enter expense name" required>
            </div>
            <br>

            <div>
                <label for="expense-amount">Amount:</label>
                <input type="number" id="expense-amount" name="expense-amount" placeholder="Enter amount" required>
            </div>
            <br>

            <div>
                <label for="expense-category">Category:</label>
                <select id="expense-category" name="expense-category" required>
                    <option value="Food">Food</option>
                    <option value="Travel">Travel</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Education">Education</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <br>

            <button type="submit" id="add-expense-btn">Add Expense</button>
        </form>
    </section>

    <hr>

    <!-- Area to Display Expenses -->
    <section id="expense-display">
        <h2>Expenses List</h2>
        <ul id="expense-list"></ul>
    </section>

    <hr>

    <!-- Transaction History Section -->
    <section id="history-section">
        <h2>History</h2>
        <ul id="history-list"></ul>
    </section>


</body>
</html>
